<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator + Tic Tac Toe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .btn-switch {
      padding: 10px 15px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .calc-btn { background: #3498db; }
    .game-btn { background: #2ecc71; }

    .container {
      max-width: 320px;
      margin: auto;
    }

    /* Calculator */
    .calculator {
      background: #222;
      padding: 15px;
      border-radius: 15px;
    }

    .calculator input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .grid button {
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
    }

    .grid button:hover {
      background: #666;
    }

    /* Tic Tac Toe */
    .game {
      display: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .cell {
      height: 70px;
      font-size: 24px;
      background: #444;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .reset {
      margin-top: 15px;
      padding: 10px;
      background: red;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .cell {
        height: 60px;
      }
    }
  </style>
</head>

<body>

<h1>Utility App</h1>

<button class="btn-switch calc-btn" onclick="showCalculator()">Calculator</button>
<button class="btn-switch game-btn" onclick="showGame()">Tic Tac Toe</button>

<div class="container">

  <!-- Calculator -->
  <div class="calculator" id="calculator">
    <input type="text" id="calcInput" readonly>

    <div class="grid">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('/')">/</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('*')">*</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('-')">-</button>

      <button onclick="press('0')">0</button>
      <button onclick="clearCalc()">C</button>
      <button onclick="calculate()">=</button>
      <button onclick="press('+')">+</button>
    </div>
  </div>

  <!-- Tic Tac Toe -->
  <div class="game" id="game">
    <h3 id="status">Turn: X</h3>

    <div class="board" id="board"></div>

    <button class="reset" onclick="resetGame()">Reset</button>
  </div>

</div>

<script>
  /* Toggle */
  function showCalculator() {
    document.getElementById("calculator").style.display = "block";
    document.getElementById("game").style.display = "none";
  }

  function showGame() {
    document.getElementById("calculator").style.display = "none";
    document.getElementById("game").style.display = "block";
  }

  /* Calculator */
  function press(val) {
    document.getElementById("calcInput").value += val;
  }

  function clearCalc() {
    document.getElementById("calcInput").value = "";
  }

  function calculate() {
    try {
      let result = eval(document.getElementById("calcInput").value);
      document.getElementById("calcInput").value = result;
    } catch {
      document.getElementById("calcInput").value = "Error";
    }
  }

  /* Tic Tac Toe */
  let board = Array(9).fill("");
  let currentPlayer = "X";

  const boardDiv = document.getElementById("board");

  function renderBoard() {
    boardDiv.innerHTML = "";
    board.forEach((cell, i) => {
      const btn = document.createElement("button");
      btn.classList.add("cell");
      btn.innerText = cell;
      btn.onclick = () => move(i);
      boardDiv.appendChild(btn);
    });
  }

  function move(i) {
    if (board[i] !== "" || checkWinner()) return;

    board[i] = currentPlayer;
    currentPlayer = currentPlayer === "X" ? "O" : "X";

    renderBoard();
    updateStatus();
  }

  function updateStatus() {
    let winner = checkWinner();
    if (winner) {
      document.getElementById("status").innerText = "Winner: " + winner;
    } else {
      document.getElementById("status").innerText = "Turn: " + currentPlayer;
    }
  }

  function checkWinner() {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    for (let [a,b,c] of lines) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return board[a];
      }
    }
    return null;
  }

  function resetGame() {
    board = Array(9).fill("");
    currentPlayer = "X";
    renderBoard();
    updateStatus();
  }

  renderBoard();
</script>

</body>
</html>
